services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      APP_TITLE: ${APP_TITLE:-ClusterKeep}
    volumes:
      - ./app.py:/app/app.py:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
      - ./tests:/app/tests:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ui-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:5000"
    environment:
      APP_TITLE: ${APP_TITLE:-ClusterKeep}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
