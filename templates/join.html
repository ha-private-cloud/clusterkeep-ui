{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center text-center max-w-md mx-auto">
  <h1
    class="font-display text-4xl font-bold text-stone-900 dark:text-stone-50 tracking-tight leading-tight mb-6"
  >
    Log in
  </h1>

  {% if error %}
  <div
    class="w-full text-sm text-red-800 dark:text-red-200 bg-red-50 dark:bg-red-950 border border-red-200 dark:border-red-900 rounded-lg px-4 py-3 mb-6"
    role="alert"
  >
    {{ error }}
  </div>
  {% endif %}

  {% if storage_login_url %}
  <a
    href="{{ storage_login_url }}"
    class="inline-flex items-center justify-center w-full px-6 py-3 mb-8 text-base font-semibold text-white bg-amber-700 rounded-lg hover:bg-amber-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-amber-700 dark:focus-visible:ring-offset-stone-950"
  >
    Log in to your account
  </a>
  {% endif %}

  <div class="w-full border-t border-stone-200 dark:border-stone-800 pt-8">
    <p class="text-stone-600 dark:text-stone-300 mb-4">
      New here? Enter your invite code and choose a username and password.
    </p>
    <form method="post" action="{{ url_for('join') }}" class="flex flex-col gap-4">
      <input
        type="text"
        name="invite_code"
        placeholder="Invite code"
        required
        autofocus
        class="w-full px-4 py-3 text-base rounded-lg border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-900 text-stone-900 dark:text-stone-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-700"
      />
      <input
        type="text"
        name="username"
        placeholder="Username"
        autocomplete="username"
        required
        class="w-full px-4 py-3 text-base rounded-lg border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-900 text-stone-900 dark:text-stone-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-700"
      />
      <input
        type="email"
        name="email"
        placeholder="Email address"
        autocomplete="email"
        required
        class="w-full px-4 py-3 text-base rounded-lg border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-900 text-stone-900 dark:text-stone-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-700"
      />
      <input
        type="password"
        name="password"
        placeholder="Password"
        autocomplete="new-password"
        minlength="12"
        required
        class="w-full px-4 py-3 text-base rounded-lg border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-900 text-stone-900 dark:text-stone-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-700"
      />
      <input
        type="password"
        name="password_confirm"
        placeholder="Confirm password"
        autocomplete="new-password"
        minlength="12"
        required
        class="w-full px-4 py-3 text-base rounded-lg border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-900 text-stone-900 dark:text-stone-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-700"
      />
      <button
        type="submit"
        class="inline-flex items-center justify-center w-full px-6 py-3 text-base font-semibold text-stone-900 dark:text-stone-100 border border-stone-300 dark:border-stone-700 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-amber-700 dark:focus-visible:ring-offset-stone-950"
      >
        Create account
      </button>
    </form>
  </div>
</div>
{% endblock %}
