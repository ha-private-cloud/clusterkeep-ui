{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center text-center max-w-3xl mx-auto">
  <h1
    class="font-display text-4xl md:text-5xl font-bold text-stone-900 dark:text-stone-50 tracking-tight leading-tight mb-6"
  >
    Keep Runner
  </h1>

  <canvas
    id="game-canvas"
    width="480"
    height="160"
    class="w-full max-w-lg rounded-lg border border-stone-300 dark:border-stone-700"
  ></canvas>

  <p class="text-sm text-stone-600 dark:text-stone-400 mt-4 mb-8">
    Press Space, ↑, or tap the canvas to jump.
  </p>

  <a
    href="{{ url_for('index') }}"
    class="inline-flex items-center justify-center px-6 py-3 text-base font-semibold text-stone-900 dark:text-stone-100 border border-stone-300 dark:border-stone-700 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-amber-700 dark:focus-visible:ring-offset-stone-950"
  >
    ← Back to {{ title }}
  </a>
</div>
{% endblock %}

{% block head_extra %}
<script src="{{ url_for('static', filename='js/game.js') }}" defer></script>
{% endblock %}
