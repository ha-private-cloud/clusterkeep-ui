<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="{% block meta_description %}{{ title }} — private cloud storage.{% endblock %}"
    />
    <title>{% block page_title %}{{ title }}{% endblock %}</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ url_for('static', filename='images/favicon.svg') }}"
    />
    <link
      rel="apple-touch-icon"
      href="{{ url_for('static', filename='images/apple-touch-icon.png') }}"
    />
    <link
      rel="manifest"
      href="{{ url_for('static', filename='manifest.webmanifest') }}"
    />
    <meta name="theme-color" content="#292524" />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="{{ url_for('static', filename='fonts/inter-latin.woff2') }}"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="{{ url_for('static', filename='fonts/cinzel-latin.woff2') }}"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/nav.js') }}" defer></script>
    {% block head_extra %}{% endblock %}
  </head>
  <body
    class="flex flex-col min-h-screen font-sans text-stone-900 bg-stone-50 dark:bg-stone-950 dark:text-stone-100"
  >
    {% block header %}
    <header
      class="sticky top-0 z-50 w-full border-b border-stone-200 dark:border-stone-800 bg-stone-50/90 dark:bg-stone-950/90"
    >
      <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="min-h-16 py-3 sm:py-0 flex flex-wrap items-center justify-between gap-x-4 gap-y-3">
          <a
            class="flex items-center gap-3 text-stone-900 dark:text-stone-50"
            href="{{ url_for('index') }}"
          >
            <span
              class="flex items-center justify-center w-9 h-9 rounded-md bg-stone-800 text-white"
            >
              {% include "partials/logo.html" %}
            </span>
            <span class="font-display text-xl font-bold tracking-wide">{{ title }}</span>
          </a>

          <button
            type="button"
            data-nav-toggle
            aria-controls="nav-links"
            aria-expanded="false"
            aria-label="Open menu"
            class="sm:hidden text-stone-600 hover:text-stone-900 dark:text-stone-400 dark:hover:text-stone-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-700 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-stone-950"
          >
            <svg
              class="w-6 h-6"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>

          <nav
            id="nav-links"
            class="hidden sm:flex w-full sm:w-auto flex-col sm:flex-row items-center gap-4 sm:gap-6"
          >
            <a
              class="text-sm font-medium text-stone-600 hover:text-stone-900 dark:text-stone-400 dark:hover:text-stone-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-700 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-stone-950"
              href="{{ url_for('join') }}"
              >Log In</a
            >
            <a
              class="text-sm font-medium text-stone-600 hover:text-stone-900 dark:text-stone-400 dark:hover:text-stone-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-700 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-stone-950"
              href="https://github.com/ha-private-cloud"
              target="_blank"
              rel="noopener noreferrer"
              >GitHub</a
            >
            <a
              class="text-sm font-medium text-stone-600 hover:text-stone-900 dark:text-stone-400 dark:hover:text-stone-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-700 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-stone-950"
              href="https://bustamantebg.uk"
              target="_blank"
              rel="noopener noreferrer"
              >Author</a
            >
            <button
              type="button"
              data-theme-toggle
              hidden
              aria-label="Switch theme"
              aria-pressed="false"
              class="text-stone-600 hover:text-stone-900 dark:text-stone-400 dark:hover:text-stone-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-700 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-stone-950"
            >
              <svg
                class="w-5 h-5 hidden dark:block"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                />
              </svg>
              <svg
                class="w-5 h-5 block dark:hidden"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
              </svg>
            </button>
          </nav>
        </div>
      </div>
    </header>
    {% endblock %}

    <main class="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-24">
      {% block content %}{% endblock %}
    </main>

    {% block footer %}
    <footer class="mt-auto border-t border-stone-200 dark:border-stone-800">
      <div
        class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex items-center gap-2 text-sm text-stone-500 dark:text-stone-400"
      >
        <span>{{ title }} &copy; {{ year }}</span>
      </div>
    </footer>
    {% endblock %}
  </body>
</html>
