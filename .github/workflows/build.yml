name: build

# Runs on the CI bastion's self-hosted runner (see ../../proxmox-tofu's
# "CI bastion" , provisioned there since it needs the kubeconfig and this
# repo's gitignored tofu/terraform.tfvars, neither of which can live in
# git). Builds+pushes via cluster-ci, then runs this repo's own Tofu to
# deploy , that's what actually rolls the image out, since
# clusterkeep-ui/tofu now auto-selects the newest tag on this branch's
# channel on every apply (see tofu/clusterkeep-ui.tf).
on:
  push:
    branches: [dev, preview, main]

jobs:
  build-and-deploy:
    runs-on: [self-hosted]
    steps:
      - name: Resolve environment for this branch
        id: env
        run: |
          case "${{ github.ref_name }}" in
            dev)
              echo "namespace=clusterkeep-dev-pub" >> "$GITHUB_OUTPUT"
              echo "workspace=default" >> "$GITHUB_OUTPUT"
              echo "tofu_args=" >> "$GITHUB_OUTPUT"
              ;;
            preview)
              echo "namespace=clusterkeep-prv-pub" >> "$GITHUB_OUTPUT"
              echo "workspace=prv" >> "$GITHUB_OUTPUT"
              echo "tofu_args=-var-file=prv.tfvars" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "namespace=clusterkeep-prd-pub" >> "$GITHUB_OUTPUT"
              echo "workspace=prd" >> "$GITHUB_OUTPUT"
              echo "tofu_args=-var-file=prd.tfvars" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "no environment mapped for branch ${{ github.ref_name }}" >&2
              exit 1
              ;;
          esac

      # This repo lives permanently at ~/project/clusterkeep-ui on the
      # bastion (see proxmox-tofu/scripts/setup-bastion.sh) , cluster-cli
      # and its Tofu both expect that fixed sibling-repo layout, so this
      # syncs it in place rather than using actions/checkout's default
      # per-job workspace path.
      - name: Sync repo checkout to this commit
        run: |
          # checkout -B (not reset --hard on whatever's currently checked
          # out) so HEAD ends up on a local branch actually named
          # ${{ github.ref_name }} , cluster-cli's tag_for_branch reads that
          # name to pick DEV-/PREVIEW-/plain, so a stale branch name here
          # would silently mistag the image.
          git -C "$HOME/project/clusterkeep-ui" fetch origin "${{ github.ref_name }}"
          git -C "$HOME/project/clusterkeep-ui" checkout -B "${{ github.ref_name }}" "${{ github.sha }}"

      - name: Build and push image
        run: |
          cluster-cli build "$HOME/project/clusterkeep-ui" \
            --namespace "${{ steps.env.outputs.namespace }}" \
            --no-deploy

      - name: Deploy via tofu
        run: |
          cluster-cli tofu clusterkeep-ui workspace select "${{ steps.env.outputs.workspace }}"
          cluster-cli tofu clusterkeep-ui apply -auto-approve ${{ steps.env.outputs.tofu_args }}
