<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!--
    ClusterKeep mark. Path data is shared with templates/partials/logo.html and
    a test asserts the two stay identical. Built on a 16x16 cell grid, so at
    favicon size one cell lands on exactly one pixel.

    A favicon inherits no colour context, so the ink is literal here: near-black
    for light tab bars, near-white for dark ones.
  -->
  <title>ClusterKeep</title>
  <style>
    .ink { fill: #17171a; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e2e2df; }
    }
  </style>
  <path class="ink" fill-rule="evenodd" d="M4 1H6V3H4ZM7 1H9V3H7ZM10 1H12V3H10ZM4 3H12V13H4ZM0 6H1V7H0ZM2 6H3V7H2ZM0 7H3V13H0ZM13 5H14V6H13ZM15 5H16V6H15ZM13 6H16V13H13ZM0 13H16V15H0ZM5 4H11V5H5ZM5 6H11V7H5ZM5 8H11V9H5ZM7 10H9V13H7Z" />
</svg>
